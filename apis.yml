name: Subsplash
kind: company
description: Subsplash is an all-in-one church and ministry engagement platform -
  custom mobile and TV apps, websites, media hosting and delivery, online giving,
  and church management (People, Groups, Events, Volunteers). Subsplash publishes a
  REST developer API (OAuth 2.0, hosted on core.subsplash.com) for programmatic
  access to media, giving records, people, groups and messaging, and event
  registrations. Access is gated - full API documentation is released only after
  submitting the developer documentation-access form, and API credentials (Client
  ID / Client Secret) must be provisioned by a Subsplash representative on a
  qualifying paid plan (Pro / Enterprise). Because the documented endpoint surface
  is behind that gate, the APIs listed here are modeled from Subsplash's public
  product, support, and integration material rather than transcribed from an open
  reference, and are flagged endpointsModeled.
